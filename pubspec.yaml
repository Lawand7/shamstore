name: shamstore
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 👈 تم إضافة مكتبة اللغات الرسمية هنا لحل أخطاء الـ GlobalMaterial في الـ main
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/l10n/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mylogo.png"